[tool.poetry]
name = "exam-parser"
version = "1.0.0"
description = "Parse bacalaureat exam PDFs to markdown/LaTeX with Gemini 2.0 Vision"
authors = ["Profu Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11"
google-genai = "^1.0.0"
python-dotenv = "^1.0.0"
supabase = "^2.0.0"
tqdm = "^4.66.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
