[project]
name = "exam-parser"
version = "1.0.0"
description = "Bacalaureat exam ingestion: Nougat (HF Jobs), Ollama structured markdown, merge, Supabase"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.0.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "profu-logging",
    "PyYAML>=6.0.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "torch>=2.2.0",
    "tqdm>=4.66.0",
    "transformers>=4.44.0",
    "pydantic-settings>=2.0.0",
    "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"exam_parser" = "."

[tool.setuptools]
packages = [
    "exam_parser",
    "exam_parser.parsers",
    "exam_parser.pipeline",
    "exam_parser.pipeline.steps",
]
