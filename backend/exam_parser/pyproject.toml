[project]
name = "exam-parser"
version = "1.0.0"
description = "Parse bacalaureat exam PDFs to markdown/LaTeX with Gemini 2.0 Vision"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=1.0.0",
    "profu-logging",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "tqdm>=4.66.0",
    "pydantic-settings>=2.0.0",
    "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"exam_parser" = "."

[tool.setuptools]
packages = [
    "exam_parser",
    "exam_parser.parsers",
    "exam_parser.pipeline",
    "exam_parser.pipeline.steps",
]
