[project]
name = "exam-parser"
version = "1.0.0"
description = "Parse bacalaureat exam PDFs to markdown/LaTeX with Gemini 2.0 Vision"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"exam_parser" = "."

[tool.setuptools]
packages = ["exam_parser", "exam_parser.parsers"]
