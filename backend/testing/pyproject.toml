[project]
name = "profu-testing"
version = "0.1.0"
description = "Local synthetic scenarios, checklist generation, and clarify step-by-step run harness for Langfuse-backed eval."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langfuse>=4.0",
    "langchain-google-genai>=2.0",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
profu-test-clarify = "profu_testing.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["profu_testing"]
