[pytest]
testpaths = ai_backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
filterwarnings =
    # Third-party: LangChain still imports pydantic.v1 on Python 3.14+ (library fix pending).
    ignore:Core Pydantic V1 functionality isn't compatible:UserWarning
    # Third-party: google-genai internal typing (Python 3.17 deprecation path).
    ignore:.*_UnionGenericAlias.*:DeprecationWarning
    # Third-party: Starlette re-exports legacy status name for 422.
    ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*:DeprecationWarning
    # Third-party: supabase client passes timeout/verify into postgrest (deprecated there).
    ignore:The 'timeout' parameter is deprecated:DeprecationWarning
    ignore:The 'verify' parameter is deprecated:DeprecationWarning
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    no_auth_dependency_override: Do not override get_current_user_id (e.g. test 401 without Bearer)
    no_llm_dependency_override: Do not override get_llm (tests that call real get_llm)
asyncio_mode = auto
