[project]
name = "crawler"
version = "1.0.0"
description = "Crawler for bacalaureat M1 PDFs from variante-mate.ro and heiprofu.ro"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"crawler" = "."

[tool.setuptools]
packages = ["crawler"]
