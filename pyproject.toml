[project]
name = "profu"
version = "1.0.0"
description = "Profu - AI-Powered Bacalaureat Preparation Assistant"
requires-python = ">=3.13"
dependencies = [
    "ai-backend[dev]",
    "uvicorn[standard]>=0.27.0",
    "crawler",
    "exam-parser",
    "poethepoet",
    "profu-logging",
]

[tool.uv.sources]
ai-backend = { workspace = true }
crawler = { workspace = true }
exam-parser = { workspace = true }
profu-logging = { workspace = true }

[tool.uv.workspace]
members = [
    "backend/ai_backend",
    "backend/crawler",
    "backend/exam_parser",
    "backend/logging",
]

[tool.poe.tasks]
# Watch only backend/ai_backend so other project writes (logs, Flutter, etc.) don't trigger reload.
# Exclude __pycache__ and .pyc; --reload-delay debounces rapid phantom changes (e.g. IDE/watcher quirks).
ai = "uvicorn ai_backend.main:app --reload --reload-dir backend/ai_backend --reload-exclude '**/__pycache__/**' --reload-exclude '**/*.pyc' --reload-delay 0.5 --host 0.0.0.0 --port 8080"
# Copy root .env into flutter_app so Flutter uses the same config as ai_backend
copy_env_flutter = "python -c \"import shutil; from pathlib import Path; s=Path('.env'); d=Path('flutter_app/.env'); shutil.copy(s,d) if s.exists() else None\""
flutter_run = { shell = "flutter run -d chrome", cwd = "flutter_app" }
ui = ["copy_env_flutter", "flutter_run"]
# --ignore-health-checks: allows start on Docker Desktop when vector container is unhealthy (connection refused to Docker socket)
supabase = { shell = "npx supabase start --ignore-health-check" }
test = ["test_ai", "test_ui"]
test_ai = "pytest backend/ai_backend/tests -v"
test_ui = { shell = "flutter test", cwd = "flutter_app" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["profu"]
