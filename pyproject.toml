[project]
name = "profu"
version = "1.0.0"
description = "Profu - AI-Powered Bacalaureat Preparation Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-backend[dev]",
    "uvicorn[standard]>=0.27.0",
    "crawler",
    "exam-parser",
    "poethepoet",
    "profu-logging",
    "ruff>=0.9.0",
]

[tool.uv.sources]
ai-backend = { workspace = true }
crawler = { workspace = true }
exam-parser = { workspace = true }
profu-logging = { workspace = true }

[tool.uv.workspace]
members = [
    "backend/ai_backend",
    "backend/crawler",
    "backend/exam_parser",
    "backend/logging",
]

[tool.poe.tasks]
# Ruff: auto-fix what it can; exit non-zero if any issues remain (unsafe fixes off by default).
lint = "ruff check ./backend --fix"
exam_parser_ui = "streamlit run backend/exam_parser/pipeline/ui.py"
pipeline_ui = { ref = "exam_parser_ui" }
# Watch only backend/ai_backend so other project writes (logs, Flutter, etc.) don't trigger reload.
# Exclude __pycache__ and .pyc; --reload-delay debounces rapid phantom changes (e.g. IDE/watcher quirks).
ai = "uvicorn ai_backend.main:app --reload --reload-dir backend/ai_backend --reload-exclude '**/__pycache__/**' --reload-exclude '**/*.pyc' --reload-delay 0.5 --host 0.0.0.0 --port 8080"
# Copy root .env into flutter_app so Flutter uses the same config as ai_backend
copy_env_flutter = "python -c \"import shutil; from pathlib import Path; s=Path('.env'); d=Path('flutter_app/.env'); shutil.copy(s,d) if s.exists() else None\""
flutter_run = { shell = "flutter run -d chrome", cwd = "flutter_app" }
ui = ["copy_env_flutter", "flutter_run"]
# --ignore-health-checks: allows start on Docker Desktop when vector container is unhealthy (connection refused to Docker socket)
supabase = { shell = "npx supabase start --ignore-health-check" }
# Local Langfuse v3 stack (Docker): UI on LANGFUSE_PORT or 3000. See scripts/README.md.
langfuse = { shell = "bash scripts/start-langfuse.sh" }
test = ["test_ai", "test_ui"]
# exam_parser only; terminal ends with Coverage.py TOTAL (percentage).
test_ep = "pytest backend/exam_parser/tests -v --cov=exam_parser --cov-report=term-missing"
# ai_backend + exam_parser; terminal ends with Coverage.py TOTAL (percentage).
test_be = "pytest backend/ai_backend/tests backend/exam_parser/tests -v --cov=ai_backend --cov=exam_parser --cov-report=term-missing"
# Alias: same as test_be (full Python backend + coverage). Used by poe test.
test_ai = { ref = "test_be" }
test_ui = { shell = "flutter test", cwd = "flutter_app" }

[tool.coverage.run]
# Omit test packages so reported % reflects product code (pytest-cov reads this from repo root).
# Exam parser: CLI, Streamlit UI, runner, and I/O-heavy pipeline steps are integration / manual QA;
# unit tests cover config, parsers, and shared utils. Omitting them keeps the aggregate target meaningful.
omit = [
    "*/tests/*",
    "**/tests/**",
    "*/crawler/**",
    "**/exam_parser/pipeline/ui.py",
    "**/exam_parser/pipeline/cli.py",
    "**/exam_parser/pipeline/runner.py",
    "**/exam_parser/pipeline/steps/extract_problems.py",
    "**/exam_parser/pipeline/steps/extract_solutions.py",
    "**/exam_parser/pipeline/steps/index_to_vector_db.py",
    "**/exam_parser/pipeline/steps/load_to_db.py",
    "**/exam_parser/pipeline/steps/merge.py",
    "**/exam_parser/pipeline/steps/parse_problems.py",
    "**/exam_parser/pipeline/steps/parse_solutions.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["profu"]
