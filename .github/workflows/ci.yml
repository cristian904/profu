# CI/CD: runs backend and frontend tests. Failures fail the workflow and block PR merge
# when branch protection is enabled. In repo Settings → Branches → rule → Require status
# checks: add "Build Status Check" (or require "Backend Tests" and "Frontend Tests").
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Run both test jobs even if one fails, so we see full results
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Load cached venv
        id: cached-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.13-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        if: steps.cached-venv.outputs.cache-hit != 'true'
        run: uv sync

      - name: Run backend tests
        run: uv run pytest backend/ai_backend/tests -v --cov=ai_backend --cov-report=xml:backend/coverage.xml
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'test_key_for_ci' }}

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Overwrite flutter_math_fork layout file with patched version (Flutter 3.29+ removed
      # RenderObjectWithLayoutCallbackMixin — see simpleclub/flutter_math#110, #111).
      - name: Patch flutter_math_fork for Flutter compatibility
        working-directory: .
        run: |
          for CACHE in "$PUB_CACHE" "$HOME/.pub-cache" "$RUNNER_TOOL_CACHE" ""; do
            [ -z "$CACHE" ] || [ ! -d "$CACHE" ] && continue
            TARGET=$(find "$CACHE" -path "*flutter_math_fork*/lib/src/render/layout/layout_builder_baseline.dart" -type f 2>/dev/null | head -1)
            [ -n "$TARGET" ] && break
          done
          if [ -z "$TARGET" ] || [ ! -f "$TARGET" ]; then
            echo "::error::flutter_math_fork layout file not found"
            echo "PUB_CACHE=$PUB_CACHE HOME=$HOME"
            find "$HOME" -name "layout_builder_baseline.dart" -path "*flutter_math*" 2>/dev/null | head -5
            exit 1
          fi
          cp .github/flutter_math_fork_patch/layout_builder_baseline.dart "$TARGET"
          echo "Patched $TARGET"

      - name: Run frontend tests
        run: flutter test --coverage --no-pub

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./flutter_app/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # Single gate for PR merge: require this check in branch protection to block merge on test failure
  build-status:
    name: Build Status Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.backend-tests.result }}" == "success" ]] && [[ "${{ needs.frontend-tests.result }}" == "success" ]]; then
            echo "All tests passed."
            exit 0
          else
            echo "Tests failed: backend=${{ needs.backend-tests.result }}, frontend=${{ needs.frontend-tests.result }}"
            exit 1
          fi
