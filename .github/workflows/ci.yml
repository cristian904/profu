# CI: Ruff on backend/, Dart analyzer + tests on flutter_app/. Failures fail the
# workflow and block PR merge when branch protection is enabled. Require status
# check "Build Status Check" in branch protection.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Run test jobs in parallel; aggregate job runs even if one fails so both results are visible.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: AI Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Load cached venv
        id: cached-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.13-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        if: steps.cached-venv.outputs.cache-hit != 'true'
        run: uv sync

      # Do not use --fix in CI; only verify (see root pyproject.toml poe task lint for local autofix).
      - name: Ruff check (Python backend)
        run: uv run ruff check ./backend

      - name: Run AI backend tests
        run: uv run pytest backend/ai_backend/tests -v --cov=ai_backend --cov-report=xml:backend/coverage.xml
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'test_key_for_ci' }}

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  flutter-tests:
    name: Flutter UI Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pubspec.yaml lists `.env` as an asset; the real file is gitignored and missing on CI.
      - name: Placeholder .env for Flutter asset manifest
        working-directory: flutter_app
        run: cp .env.example .env

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      # Analyzer: infos/warnings are printed but do not fail the job (legacy deprecations).
      # Remove --no-fatal-* flags to enforce a clean analyze bar.
      - name: Dart analyzer (flutter analyze)
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests (unit + widget)
        working-directory: flutter_app
        run: flutter test

  build-status:
    name: Build Status Check
    runs-on: ubuntu-latest
    needs: [backend-tests, flutter-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          backend="${{ needs.backend-tests.result }}"
          flutter="${{ needs.flutter-tests.result }}"
          failed=0
          if [[ "$backend" != "success" ]]; then
            echo "AI backend tests failed: $backend"
            failed=1
          else
            echo "AI backend tests passed."
          fi
          if [[ "$flutter" != "success" ]]; then
            echo "Flutter UI tests failed: $flutter"
            failed=1
          else
            echo "Flutter UI tests passed."
          fi
          exit $failed
